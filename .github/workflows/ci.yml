name: 'Continuous Integration'
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * SUN'
env:
  GRADLE_OPTS: >-
    -Dorg.gradle.project.org.alfresco.maven.nexus.username=${{ secrets.ALFRESCO_NEXUS_USERNAME }} 
    -Dorg.gradle.project.org.alfresco.maven.nexus.password=${{ secrets.ALFRESCO_NEXUS_PASSWORD }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21 (minimum version 21 needed for SonarQube Cloud analysis)
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
      - name: Unit tests
        run: ./gradlew test --parallel --info
      - name: Upload analysis to sonarcloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew sonarqube -i
      - name: Upload test artifact
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-result
          path: /home/runner/work/**/build/reports
          retention-days: 2
  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ "community-7.0.0", "community-7.1.1", "community-7.2.0", "community-7.3.0", "community-7.4.0", "community-23.1.0", "community-23.2.0", "community-23.3.0", "community-23.4.0", "community-25.1.0", "community-25.3.0", "enterprise-7.0.1", "enterprise-7.1.0", "enterprise-7.2.0", "enterprise-7.3.0", "enterprise-7.4.0", "enterprise-23.1.0", "enterprise-23.2.0", "enterprise-23.3.0", "enterprise-23.4.0", "enterprise-23.5.1", "enterprise-23.6.0", "enterprise-25.1.0", "enterprise-25.3.0", "enterprise-25.4.1"]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Login to docker registry
        run: echo '${{ secrets.HARBOR_PASSWORD }}' | docker login docker.xenit.eu --username '${{ secrets.HARBOR_USER }}' --password-stdin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
      - name: Integration tests
        run: ./gradlew :2repository:${{ matrix.version }}:integrationTests --info --stacktrace
      - name: Upload test artifact
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-${{ matrix.version }}-result
          path: /home/runner/work/**/build/reports
          retention-days: 2
  share-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ "community-7.0.1", "community-7.1.0", "community-7.2.1", "community-7.3.0", "community-7.4.0", "community-23.1.0", "community-23.2.0", "community-23.3.0", "community-23.4.0", "community-25.1.0", "community-25.3.0" ]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
      - name: Build share image
        run: ./gradlew :2share:${{ matrix.version }}:buildDockerImage --info --stacktrace
  publish-docker-images:
    needs: [ test, integration-test, share-build ]
    runs-on: ubuntu-latest-4-cores
    if: ${{ startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Login to docker registry
        run: echo '${{ secrets.HARBOR_PASSWORD }}' | docker login docker.xenit.eu --username '${{ secrets.HARBOR_USER }}' --password-stdin
        # We have to split out publishing to public and private repo's because pushing to docker.io does not seem to work
        # without supplying DOCKER_USER and DOCKER_PASSWORD. However, supplying those environment variables breaks
        # publishing to other repositories
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
      - name: Publish public docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ./gradlew pushDockerImage -PincludeEnterprise=false
      - name: Publish private docker images
        run: ./gradlew :2repository:pushDockerImage -PincludeCommunity=false
