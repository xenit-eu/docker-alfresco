subprojects {
    group = 'eu.xenit.alfresco'
    def baseVersion = ci.isTag() ? ci.tag : 'v2.1.0'
    version = baseVersion[1..baseVersion.length() - 1]
    apply plugin: 'eu.xenit.docker'
    apply plugin: 'java'
    apply from: "${rootProject.projectDir}/jacoco.gradle"

    if (new File("${project.projectDir}/overload.gradle").exists()) {
        apply from: "${project.projectDir}/overload.gradle"
    }

    def tomcatVersion = project.tomcat.version

    configurations {
        sharedLibs
    }
    java {
        withJavadocJar()
        withSourcesJar()
    }

    def javaVersion = tomcatVersion.startsWith("11.") ? 21 : tomcatVersion.startsWith("10.") ? 17 : 11
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }
    dependencies {

        compileOnly "org.projectlombok:lombok:1.18.32"
        annotationProcessor "org.projectlombok:lombok:1.18.32"
        implementation "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"
        implementation "org.apache.tomcat.embed:tomcat-embed-jasper:${tomcatVersion}"
        implementation "org.apache.tomcat:tomcat-jasper:${tomcatVersion}"
        implementation "org.apache.tomcat:tomcat-jasper-el:${tomcatVersion}"
        implementation "org.apache.tomcat:tomcat-jsp-api:${tomcatVersion}"
        implementation "eu.xenit.logging:json-logging:${jsonLoggingVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
        testImplementation("org.junit-pioneer:junit-pioneer:2.1.0")
        testImplementation group: 'io.rest-assured', name: 'rest-assured', version: restAssuredVersion
        testImplementation group: 'io.rest-assured', name: 'json-path', version: restAssuredVersion
        testImplementation group: 'io.rest-assured', name: 'rest-assured-common', version: restAssuredVersion
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
        sharedLibs("eu.xenit.logging:json-logging:${jsonLoggingVersion}") {
            transitive = false
        }
        sharedLibs("org.apache.logging.log4j:log4j-layout-template-json:${jsonTemplateLayoutVersion}") {
            transitive = false
        }
    }

    boolean isRelease = ci.branch?.equals("master")
            || ci.branch?.equals("release")
            || (ci.tag != null && ci.tag.toLowerCase().startsWith("v"))
    if (!isRelease) {
        version += "-SNAPSHOT"
    }

    test {
        useJUnitPlatform()
        jvmArgs('--add-opens', 'java.base/java.util=ALL-UNNAMED',
                '--add-opens', 'java.base/java.lang=ALL-UNNAMED')
    }

    sourceSets {
        main {
            java {
                srcDir file("$project.parent.projectDir/src/shared/main/java")
                srcDir file("$project.projectDir/src/main/java")
            }
        }
        test {
            java {
                srcDir file("$project.parent.projectDir/src/shared/test/java")
                if (tomcatVersion.startsWith("10.") || tomcatVersion.startsWith("11.")) {
                    srcDir file("$project.projectDir/src/test/java")
                }
            }
            resources {
                srcDir file("$project.parent.projectDir/src/shared/test/resources")

            }
        }
    }

    sourcesJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    archivesBaseName = 'xenit-tomcat-embedded'

    dockerBuild {
        repositories = ['docker.io/xenit/tomcat']
        tags = [tomcatVersion]
    }

    // eMudhra CA compromise (CVE-2026-91403, CVE-2026-114820, CVE-2026-114406): roots distrusted in both the OS CA bundle
    // and the JDK cacerts, matched by SHA-256 fingerprint. emSign ECC Root CA - G3 and AAA Certificate Services (which
    // cross-signed the compromised intermediates) are directly involved; emSign Root CA - G1, emSign Root CA - C1 and
    // emSign ECC Root CA - C3 are distrusted as a precaution.
    def distrustedRoots = [
            '40:F6:AF:03:46:A9:9A:A1:CD:1D:55:5A:4E:9C:CE:62:C7:F9:63:46:03:EE:40:66:15:83:3D:C8:C8:D0:03:67', // emSign Root CA - G1
            '86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B', // emSign ECC Root CA - G3
            '12:56:09:AA:30:1D:A0:A2:49:B9:7A:82:39:CB:6A:34:21:6F:44:DC:AC:9F:39:54:B1:42:92:F2:E8:C8:60:8F', // emSign Root CA - C1
            'BC:4D:80:9B:15:18:9D:78:DB:3E:1D:8C:F4:F9:72:6A:79:5D:A1:64:3C:A5:F1:35:8E:1D:DB:0E:DC:0D:7E:B3', // emSign ECC Root CA - C3
            'D7:A7:A0:FB:5D:7E:27:31:D7:71:E9:48:4E:BC:DE:F7:1D:5F:0C:3E:0A:29:48:78:2B:C8:3E:E0:EA:69:9E:F4', // AAA Certificate Services
    ].join('|')
    // ISRG Root X1: an unrelated root that must stay trusted, so an empty or unreadable trust store cannot pass the check
    def isrgRootX1 = '96:BC:EC:06:26:49:76:F3:74:60:77:9A:CF:28:C5:A7:CF:E8:A3:C0:AA:E1:1A:8F:FC:EE:05:C0:BD:DF:08:C6'

    createDockerFile {
        from "docker.io/eclipse-temurin:${javaVersion}"
        runCommand 'apt-get update && apt-get install -y --only-upgrade ca-certificates && rm -rf /var/lib/apt/lists/*'
        // OS: deselect in ca-certificates.conf, so update-ca-certificates (also Temurin's USE_SYSTEM_CA_CERTS) keeps them out
        runCommand 'for f in /usr/share/ca-certificates/mozilla/*.crt; do if openssl x509 -noout -fingerprint -sha256 -in "$f" | grep -qE "' + distrustedRoots + '"; then sed -i "s|^mozilla/${f##*/}$|!&|" /etc/ca-certificates.conf; fi; done && update-ca-certificates --fresh > /dev/null'
        // JDK cacerts
        runCommand 'keytool -list -v -cacerts -storepass changeit | awk "/^Alias name: /{a=substr(\\$0, 13)} /SHA256: /{if (\\$2 ~ /' + distrustedRoots + '/) print a}" | while read -r a; do keytool -delete -cacerts -storepass changeit -alias "$a"; done'
        // Fail the build if a distrusted root is still trusted in either store, if any certificate in the OS bundle
        // cannot be read, or if ISRG Root X1 is missing from either store
        runCommand 'set -eu && B=/etc/ssl/certs/ca-certificates.crt && csplit -s -z -f /tmp/ca- $B "/BEGIN CERTIFICATE/" "{*}" && for c in /tmp/ca-*; do openssl x509 -noout -fingerprint -sha256 -in $c; done > /tmp/os.fp && rm /tmp/ca-* && keytool -list -cacerts -storepass changeit > /tmp/jvm.fp && [ $(grep -c Fingerprint= /tmp/os.fp) -eq $(grep -c "BEGIN CERTIFICATE" $B) ] && grep -q ' + isrgRootX1 + ' /tmp/os.fp && grep -q ' + isrgRootX1 + ' /tmp/jvm.fp && if grep -E "' + distrustedRoots + '" /tmp/os.fp /tmp/jvm.fp; then echo "distrusted root still trusted" >&2; exit 1; fi && rm /tmp/os.fp /tmp/jvm.fp'
        smartCopy configurations.sharedLibs, '/usr/local/tomcat/shared/lib/'
        smartCopy "${project.parent.projectDir}/src/shared/main/resources/keystore", '/keystore'
        smartCopy "${project.parent.projectDir}/src/shared/main/resources/jsonLayout/jsonLayout.json", '/usr/local/tomcat/log4j2/jsonLayout/jsonLayout.json'
        smartCopy configurations.runtimeClasspath, '/app/tomcat-embedded/lib'
        def jarName = archivesBaseName + '.jar'
        dependsOn jar
        smartCopy jar.outputs.files.singleFile, "/app/tomcat-embedded/$jarName"
        smartCopy "${project.parent.projectDir}/src/shared/main/bash/entrypoint/", '/'
        def buildDate = project.properties.getOrDefault("buildDate", ((int) (new Date().getTime() / 1000)).toString())
        environmentVariable('BUILD_DATE', buildDate)

        runCommand 'useradd -u 990 tomcat'
        runCommand 'mkdir -p /usr/local/tomcat/shared/classes'
        runCommand 'mkdir -p /usr/local/tomcat/temp && chown tomcat:tomcat /usr/local/tomcat/temp'
        workingDir '/usr/local/tomcat/temp'
        entryPoint('/docker-entrypoint.sh')
        def classPath = "/app/tomcat-embedded/$jarName:/app/tomcat-embedded/lib/*"
        volume "/usr/local/tomcat/temp"
        defaultCommand('java', '$JAVA_OPTS', '-cp', classPath, 'eu.xenit.alfresco.tomcat.embedded.Main')
        instruction("HEALTHCHECK CMD java -cp $classPath eu.xenit.alfresco.tomcat.embedded.healthcheck.HealthCheck")
    }

}